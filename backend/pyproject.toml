[project]
name = "ai-buddy-backend"
version = "0.1.0"
description = "AI-buddy backend (Flask)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gigachat>=0.2.4",
    "gunicorn>=26.2.0",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "psycopg[binary]>=3.2.0,<4",
    "psycopg-pool>=3.2.0,<4",
    "redis>=5,<7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# ТЗ: покрытие прикладного кода автотестами > 80%. Ниже — тесты (и CI) падают.
fail_under = 80
show_missing = true
