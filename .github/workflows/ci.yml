# Автопроверка каждого PR и каждого коммита в main:
#   backend  — тесты + отчёт о покрытии (артефакт coverage-backend)
#   frontend — линтер, тесты с покрытием (порог 80% строк), сборка
#   docker   — `docker compose up` на чистой машине, как у экспертов, и проверка, что всё отвечает
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — тесты и покрытие
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Установить зависимости
        run: uv sync --frozen
      - name: Тесты с покрытием (без ключей, LLM — заглушка)
        env:
          LLM_PROVIDER: echo
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Сохранить отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            backend/coverage.xml
            backend/htmlcov/

  frontend:
    name: Frontend — линтер, тесты и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Тесты с покрытием (Vitest, порог 80% строк)
        run: npm run test:cov
      - run: npm run build

  docker:
    name: Docker — запуск как у экспертов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (сценарный режим, без ключей)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Backend отвечает
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | tee health.json
          grep -q '"status":"ok"' health.json
          # без ключей эксперт должен получить сценарный режим, а не заглушку echo (спека 003)
          grep -q '"llm_provider":"scenario"' health.json
      - name: Чат отвечает (сценарный режим — следующий шаг из плана в базе)
        run: |
          curl --fail --silent --show-error -X POST http://localhost:8000/chat \
            -H 'Content-Type: application/json' -H 'X-User-Id: intern-anya' \
            -d '{"messages":[{"role":"user","content":"Что мне делать дальше?"}]}' | tee chat.json
          grep -q 'Следующий шаг' chat.json
      - name: Сайт открывается
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent http://localhost:3000 -o page.html && break
            sleep 2
          done
          grep -q 'AI-buddy' page.html
      - name: База работает и pgvector доступен
        run: docker compose exec -T db psql -U buddy -d ai_buddy -c "create extension if not exists vector; select extversion from pg_extension where extname = 'vector';"
      - name: Логи контейнеров
        if: failure()
        run: docker compose logs --no-color
      - name: Остановить
        if: always()
        run: docker compose down -v
