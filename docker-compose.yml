# AI-buddy целиком одной командой:  docker compose up --build
#   сайт     http://localhost:3000
#   backend  http://localhost:8000/health
#   база     PostgreSQL + pgvector — только внутри Docker-сети (порт наружу не открыт,
#            чтобы не конфликтовать с уже установленным PostgreSQL). Консоль базы:
#            docker compose exec db psql -U buddy -d ai_buddy
#
# Без backend/.env всё работает в сценарном режиме (LLM_PROVIDER=scenario, спека 003, ключи не нужны).
# Чтобы подключить нейросеть — заполните backend/.env по образцу backend/.env.example.
name: ai-buddy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      # тестовые учётные данные только для локальной базы в Docker
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy
      POSTGRES_DB: ai_buddy
    volumes:
      - db-data:/var/lib/postgresql/data
      # SQL-миграции применяются автоматически при ПЕРВОМ создании базы (по алфавиту).
      # Пересоздать базу с нуля: docker compose down -v
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d ai_buddy"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # в Docker backend всегда ходит в локальную базу, даже если в .env указан Supabase
      DATABASE_URL: postgresql://buddy:buddy@db:5432/ai_buddy
      FRONTEND_ORIGINS: http://localhost:3000
      # агент → корпоративные сервисы по протоколу MCP через сеть (Streamable HTTP), спека 005
      AGENT_SERVICES: mcp
      MCP_URL: http://mcp:8001/mcp
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-local-docker-demo}
      # Входы для систем Авито (docs/INTEGRATION.md): найм и Mattermost. Демо-значения, как пароль базы; на стенде — свои.
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-local-docker-demo}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-local-docker-demo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # MCP-сервер имитаций корпоративных сервисов (план, доступы, найм, отгулы) — отдельный процесс в сети Docker,
  # как MCP-серверы сервисов Авито за MCP Hub. Наружу порт не открыт: вызывать его может только backend
  # с MCP_SERVICE_TOKEN (локальное демо-значение, как пароль базы выше; для своего стенда задайте свой).
  mcp:
    build: ./backend
    command: ["python", "-m", "app.mcp_server.http_server"]
    environment:
      DATABASE_URL: postgresql://buddy:buddy@db:5432/ai_buddy
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-local-docker-demo}
      MCP_PORT: "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      mcp:
        condition: service_healthy

  grafana-init:
    image: pgvector/pgvector:pg17
    user: "0:0"
    entrypoint: ["/bin/sh", "/provision/init.sh"]
    volumes:
      - ./ops/grafana/init.sh:/provision/init.sh:ro
      - ./supabase/migrations/20261111100000_grafana_metrics.sql:/provision/metrics.sql:ro
      - ./supabase/migrations/20261112160125_grafana_topic_titles.sql:/provision/topic_titles.sql:ro
      - grafana-secret:/secrets
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.3.1
    entrypoint: ["/bin/sh", "/opt/ai-buddy/start.sh"]
    environment:
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/onboarding.json
    ports:
      - "3002:3000"
    volumes:
      - ./ops/grafana/start.sh:/opt/ai-buddy/start.sh:ro
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-secret:/run/grafana-secret:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  grafana-data:
  grafana-secret:
